name: Обновление источников рейтинга

on:
  schedule:
    - cron: '17 */6 * * *'   # каждые 6 часов
  workflow_dispatch:          # ручной запуск
  push:
    branches: [master]
    paths: ['scripts/build-sources.mjs']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Собрать данные из 6 источников
        run: node scripts/build-sources.mjs
      - name: Закоммитить обновление
        run: |
          git config user.name "ai-iq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/sources.json
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Автообновление рейтингов из 6 источников ($(date -u +%Y-%m-%d))"
            git push
          fi
