name: Обновление данных рейтинга

on:
  schedule:
    - cron: '17 */6 * * *'      # каждые 6 часов
  workflow_dispatch:             # ручной запуск из вкладки Actions
  push:
    branches: [master]
    paths: ['scripts/build-sources.mjs', 'js/normalize.js']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Тесты
        run: node --test "tests/*.test.js"
      - name: Собрать данные из 6 источников
        run: node scripts/build-sources.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # для api.github.com (SWE-bench), без него лимит 60 запросов/час
      - name: Закоммитить обновление
        run: |
          git config user.name "ai-iq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/sources.json data/aiiq.json
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Автообновление данных ($(date -u +%Y-%m-%d))"
            git push
          fi
